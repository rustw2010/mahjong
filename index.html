<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭麻將記帳助手</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .shadow-up { box-shadow: 0 -4px 10px -1px rgb(0 0 0 / 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .select-none { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-slate-50 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        /**
         * 內嵌 SVG 圖標組件：確保 100% 顯示
         */
        const Icon = ({ name, size = 20, className = "" }) => {
            const SVG_PATHS = {
                'plus': <path d="M12 5v14M5 12h14" />,
                'minus': <path d="M5 12h14" />,
                'trash-2': <g><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></g>,
                'settings': <g><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></g>,
                'trophy': <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z" />,
                'crown': <path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z" />,
                'history': <g><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></g>,
                'x': <path d="M18 6L6 18M6 6l12 12" />
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {SVG_PATHS[name] || null}
                </svg>
            );
        };

        const WINDS = ["東", "南", "西", "北"];

        const App = () => {
            const [gameState, setGameState] = useState(() => {
                const saved = localStorage.getItem('mahjong_scorer_vfinal');
                return saved ? JSON.parse(saved) : {
                    players: ["玩家1", "玩家2", "玩家3", "玩家4"],
                    hostName: "場主",
                    startingDealer: 0,
                    config: { base: 30, tai: 10 },
                    status: { wind: 0, dealerIndex: 0, lianCount: 0 },
                    history: [],
                    isSetupMode: true
                };
            });

            const [showSummary, setShowSummary] = useState(false);

            useEffect(() => {
                localStorage.setItem('mahjong_scorer_vfinal', JSON.stringify(gameState));
            }, [gameState]);

            const totals = useMemo(() => {
                const scores = [0, 0, 0, 0];
                let hostTotal = 0;
                gameState.history.forEach(round => {
                    round.scores.forEach((s, i) => scores[i] += s);
                    if (round.dongQianAmount) hostTotal += round.dongQianAmount;
                });
                return { scores, hostTotal };
            }, [gameState.history]);

            const handleStartGame = () => {
                setGameState(prev => ({
                    ...prev,
                    status: { wind: 0, dealerIndex: prev.startingDealer, lianCount: 0 },
                    isSetupMode: false
                }));
            };

            const addRound = (result) => {
                let roundScores = [0, 0, 0, 0];
                let dongQianAmount = 0;
                const { base, tai } = gameState.config;

                if (result.type === 'win') {
                    const amount = base + (result.tai * tai);
                    roundScores[result.winner] += amount;
                    roundScores[result.loser] -= amount;
                } else if (result.type === 'selfDraw') {
                    const amountPerPerson = base + (result.tai * tai);
                    roundScores[result.winner] += (amountPerPerson * 3);
                    gameState.players.forEach((_, i) => { if (i !== result.winner) roundScores[i] -= amountPerPerson; });
                    roundScores[result.winner] -= base;
                    dongQianAmount = base;
                }

                const newHistory = [{ 
                    id: Date.now(), wind: gameState.status.wind, dealer: gameState.status.dealerIndex, 
                    lian: gameState.status.lianCount, ...result, scores: roundScores, dongQianAmount 
                }, ...gameState.history];

                let nextStatus = { ...gameState.status };
                if ((result.type !== 'draw' && result.winner === gameState.status.dealerIndex) || result.type === 'draw') {
                    nextStatus.lianCount += 1;
                } else {
                    nextStatus.lianCount = 0;
                    nextStatus.dealerIndex = (gameState.status.dealerIndex + 1) % 4;
                    if (nextStatus.dealerIndex === gameState.startingDealer) {
                        nextStatus.wind = (nextStatus.wind + 1) % 4;
                    }
                }
                setGameState(prev => ({ ...prev, history: newHistory, status: nextStatus }));
            };

            const undoLastRound = () => {
                if (gameState.history.length === 0) return;
                const last = gameState.history[0];
                setGameState(prev => ({
                    ...prev,
                    history: prev.history.slice(1),
                    status: { wind: last.wind, dealerIndex: last.dealer, lianCount: last.lian }
                }));
            };

            if (gameState.isSetupMode) {
                return (
                    <div className="p-6 space-y-6 max-w-md mx-auto min-h-screen bg-white">
                        <div className="text-center py-6">
                            <h1 className="text-4xl font-black text-red-700">🀄️ 麻將記帳</h1>
                            <p className="text-slate-400 text-sm mt-2 font-medium">本地版 · 資料自動存儲</p>
                        </div>
                        <div className="bg-slate-50 rounded-3xl p-5 shadow-inner space-y-4">
                            <h2 className="font-bold text-sm text-slate-500 uppercase">玩家與起莊</h2>
                            {gameState.players.map((name, i) => (
                                <div key={i} className="flex items-center gap-3 bg-white p-2 rounded-2xl border border-slate-100 shadow-sm">
                                    <input className="flex-1 bg-transparent px-2 py-1 text-sm font-bold outline-none" value={name} onChange={e => {
                                        const n = [...gameState.players]; n[i] = e.target.value;
                                        setGameState(prev => ({...prev, players: n}));
                                    }} />
                                    <button onClick={() => setGameState(prev => ({...prev, startingDealer: i}))} className={`px-4 py-1.5 rounded-xl border text-[10px] font-black transition-all ${gameState.startingDealer === i ? 'bg-yellow-400 border-yellow-500 text-white shadow-md' : 'bg-slate-50 text-slate-300'}`}>起莊</button>
                                </div>
                            ))}
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm text-center">
                                <label className="text-[10px] text-slate-400 font-black mb-1 block">一底</label>
                                <input type="number" className="w-full font-black text-2xl outline-none text-red-600 text-center" value={gameState.config.base} onChange={e => setGameState(prev => ({...prev, config: {...prev.config, base: parseInt(e.target.value) || 0}}))} />
                            </div>
                            <div className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm text-center">
                                <label className="text-[10px] text-slate-400 font-black mb-1 block">一台</label>
                                <input type="number" className="w-full font-black text-2xl outline-none text-red-600 text-center" value={gameState.config.tai} onChange={e => setGameState(prev => ({...prev, config: {...prev.config, tai: parseInt(e.target.value) || 0}}))} />
                            </div>
                        </div>
                        <div className="bg-orange-50 rounded-3xl border border-orange-100 p-5 space-y-2">
                            <label className="text-xs font-bold text-orange-800 flex items-center gap-1.5"><Icon name="crown" size={16}/>場主 (收東錢)</label>
                            <input className="w-full bg-white rounded-2xl px-4 py-3 text-sm font-bold outline-none border border-orange-200" value={gameState.hostName} onChange={e => setGameState(prev => ({...prev, hostName: e.target.value}))} />
                        </div>
                        <button onClick={handleStartGame} className="w-full bg-red-600 text-white font-black py-5 rounded-[2.5rem] shadow-xl active:scale-95 transition-all text-xl mt-4">進入記帳</button>
                    </div>
                );
            }

            return (
                <div className="pb-40 bg-slate-50 min-h-screen">
                    <div className="bg-red-700 text-white p-5 sticky top-0 z-10 shadow-lg flex justify-between items-start">
                        <div className="flex-1">
                            <div className="text-[10px] opacity-70 mb-2 font-bold tracking-widest uppercase">即時分數</div>
                            <div className="grid grid-cols-2 gap-x-4 gap-y-1.5">
                                {gameState.players.map((name, i) => (
                                    <div key={i} className="flex justify-between items-center text-xs border-b border-white/10 pb-1">
                                        <span className="truncate pr-1 font-medium opacity-90">{name}</span>
                                        <span className={`font-mono font-black ${totals.scores[i] >= 0 ? 'text-yellow-300' : 'text-blue-200'}`}>
                                            {totals.scores[i] > 0 ? `+${totals.scores[i]}` : totals.scores[i]}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="text-right pl-6 shrink-0 flex flex-col items-end">
                            <div className="text-[11px] opacity-80 font-black bg-black/20 px-2 py-0.5 rounded mb-1">{WINDS[gameState.status.wind]}風局</div>
                            <div className="text-6xl font-black leading-none my-1 tracking-tighter shadow-sm">{gameState.players[gameState.status.dealerIndex]}</div>
                            <div className="mt-1"><span className="text-[11px] bg-white text-red-700 px-3 py-0.5 rounded-full font-black">{gameState.status.lianCount > 0 ? `連莊 ${gameState.status.lianCount}` : '平莊'}</span></div>
                        </div>
                    </div>
                    
                    <div className="p-4 space-y-6 max-w-md mx-auto">
                        <ActionPanel addRound={addRound} players={gameState.players} />
                        <div className="space-y-4">
                            <div className="flex justify-between items-center px-1">
                                <span className="font-black text-sm text-slate-600 flex items-center gap-2"><Icon name="history" size={16}/>戰局流水帳</span>
                                <button onClick={undoLastRound} className="text-xs text-blue-600 font-bold px-4 py-2 bg-white border border-blue-100 rounded-2xl shadow-sm">撤銷上把</button>
                            </div>
                            <div className="space-y-3">
                                {gameState.history.map(h => (
                                    <div key={h.id} className="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm">
                                        <div className="flex justify-between items-center text-[11px] text-slate-400 font-black mb-3 border-b border-slate-50 pb-2">
                                            <span>{WINDS[h.wind]}風局 - {gameState.players[h.dealer]}莊</span>
                                            <span className="bg-slate-100 px-2 py-0.5 rounded-lg text-slate-600">{h.tai}台</span>
                                        </div>
                                        <div className="text-xl font-black text-slate-800">
                                            {h.type === 'draw' ? <span className="text-slate-300 italic">這把流局</span> : (
                                                <div className="flex items-center flex-wrap gap-1.5">
                                                    <span className="text-red-600 underline decoration-red-100 decoration-4 underline-offset-4">{gameState.players[h.winner]}</span> 
                                                    <span className="text-slate-400 text-sm font-bold">{h.type === 'win' ? '胡' : '自摸'}</span>
                                                    {h.type === 'win' && <span className="text-blue-600 underline decoration-blue-100 decoration-4 underline-offset-4">{gameState.players[h.loser]}</span>}
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex gap-2 mt-4 overflow-x-auto no-scrollbar">
                                            {h.scores.map((s, idx) => s!==0 && <span key={idx} className={`px-3 py-1 rounded-xl text-[10px] font-black border ${s>0?'bg-red-50 text-red-600 border-red-100':'bg-blue-50 text-blue-600 border-blue-100'}`}>{gameState.players[idx]}:{s>0?`+${s}`:s}</span>)}
                                            {h.dongQianAmount > 0 && <span className="bg-orange-50 text-orange-700 px-3 py-1 rounded-xl text-[10px] font-black border border-orange-100">東錢:{h.dongQianAmount}</span>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-lg border-t p-5 flex justify-around shadow-up z-20">
                        <button onClick={()=>setShowSummary(true)} className="flex flex-col items-center gap-1.5 text-slate-500 active:text-red-600"><Icon name="trophy" size={24}/><span className="text-[10px] font-black">結算帳單</span></button>
                        <button onClick={()=>setGameState(prev=>({...prev, isSetupMode: true}))} className="flex flex-col items-center gap-1.5 text-slate-500 active:text-blue-600"><Icon name="settings" size={24}/><span className="text-[10px] font-black">更改設定</span></button>
                        <button onClick={()=>{if(confirm("確定清空紀錄？")) setGameState(prev=>({...prev, history:[], isSetupMode: true}))}} className="flex flex-col items-center gap-1.5 text-red-400 active:text-red-700"><Icon name="trash-2" size={24}/><span className="text-[10px] font-black">全部清空</span></button>
                    </div>
                    {showSummary && <SummaryModal players={gameState.players} totals={totals} hostName={gameState.hostName} onClose={()=>setShowSummary(false)} />}
                </div>
            );
        };

        const ActionPanel = ({ addRound, players }) => {
            const [entry, setEntry] = useState({ type: 'win', winner: 0, loser: 1, tai: 0 });
            return (
                <div className="bg-white rounded-[2.5rem] p-6 shadow-2xl border border-slate-100 space-y-6">
                    <div className="flex bg-slate-100 p-2 rounded-[1.5rem]">
                        {['win', 'selfDraw', 'draw'].map(t => (
                            <button key={t} onClick={()=>setEntry({...entry, type:t})} className={`flex-1 py-3 rounded-[1rem] text-sm font-black transition-all ${entry.type===t?'bg-white shadow-lg text-red-600 scale-105':'text-slate-500 opacity-60'}`}>{t==='win'?'胡牌':t==='selfDraw'?'自摸':'流局'}</button>
                        ))}
                    </div>
                    {entry.type !== 'draw' && (
                        <div className="space-y-6 animate-in fade-in">
                            <div className="space-y-2"><div className="text-[10px] text-slate-400 font-black uppercase ml-2 tracking-widest">贏家是誰</div>
                            <div className="grid grid-cols-4 gap-2.5">{players.map((n, i) => <button key={i} onClick={()=>setEntry({...entry, winner:i})} className={`py-4 border rounded-2xl text-[12px] font-black truncate px-1 transition-all ${entry.winner===i?'bg-red-50 border-red-500 text-red-700 ring-4 ring-red-50 shadow-md':'bg-white text-slate-500'}`}>{n}</button>)}</div></div>
                            {entry.type === 'win' && <div className="space-y-2"><div className="text-[10px] text-slate-400 font-black uppercase ml-2 tracking-widest">誰放槍了</div>
                            <div className="grid grid-cols-4 gap-2.5">{players.map((n, i) => <button key={i} disabled={entry.winner===i} onClick={()=>setEntry({...entry, loser:i})} className={`py-4 border rounded-2xl text-[12px] font-black truncate px-1 transition-all ${entry.loser===i?'bg-blue-50 border-blue-500 text-blue-700 ring-4 ring-blue-50 shadow-md':'bg-white text-slate-500 disabled:opacity-10'}`}>{n}</button>)}</div></div>}
                            <div className="flex justify-between items-center p-4 bg-slate-50 rounded-3xl border border-slate-100"><span className="text-sm font-black text-slate-700">總台數 <span className="text-[10px] font-normal opacity-50 block">(含莊家台)</span></span>
                            <div className="flex items-center gap-6"><button onClick={()=>setEntry({...entry, tai:Math.max(0,entry.tai-1)})} className="p-3 bg-white border border-slate-200 rounded-full shadow-md"><Icon name="minus" size={20}/></button><span className="text-4xl font-black font-mono w-10 text-center">{entry.tai}</span><button onClick={()=>setEntry({...entry, tai:entry.tai+1})} className="p-3 bg-white border border-slate-200 rounded-full shadow-md"><Icon name="plus" size={20}/></button></div></div>
                        </div>
                    )}
                    <button onClick={()=>{if(entry.type==='win'&&entry.winner===entry.loser)return; addRound(entry); setEntry({...entry, tai:0});}} className="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-black shadow-xl active:scale-[0.97] transition-all text-xl tracking-tight">紀錄戰果</button>
                </div>
            );
        };

        const SummaryModal = ({ players, totals, hostName, onClose }) => (
            <div className="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4 backdrop-blur-lg">
                <div className="bg-white rounded-[3.5rem] w-full max-w-sm overflow-hidden shadow-2xl">
                    <div className="bg-red-700 p-10 text-white text-center relative"><button onClick={onClose} className="absolute top-8 right-8 bg-white/20 p-2 rounded-full active:bg-white/40"><Icon name="x" size={24}/></button><Icon name="trophy" size={72} className="mx-auto text-yellow-300 mb-4 drop-shadow-lg" /><h2 className="text-4xl font-black italic tracking-tighter">總結帳單</h2></div>
                    <div className="p-10 space-y-6">
                        <div className="space-y-5">{players.map((n, i) => (<div key={i} className="flex justify-between items-center border-b border-slate-100 pb-4"><div className="flex items-center gap-5"><div className={`w-10 h-10 rounded-2xl flex items-center justify-center text-xs text-white font-black shadow-lg ${totals.scores[i] >= 0 ? 'bg-red-500 rotate-3' : 'bg-blue-500 -rotate-3'}`}>{i+1}</div><span className="font-black text-slate-700 text-xl tracking-tight">{n}</span></div><span className={`text-3xl font-black font-mono ${totals.scores[i]>=0?'text-red-600':'text-blue-600'}`}>{totals.scores[i] > 0 ? `+${totals.scores[i]}` : totals.scores[i]}</span></div>))}</div>
                        <div className="bg-orange-50 p-6 rounded-[2rem] flex justify-between items-center border border-orange-100 shadow-inner"><div><div className="font-black text-orange-800 text-lg flex items-center gap-2"><Icon name="crown" size={18}/>{hostName}<div className="text-[10px] text-orange-500 font-black uppercase block">東錢累計</div></div></div><span className="text-3xl font-black font-mono text-orange-600">+{totals.hostTotal}</span></div>
                        <button onClick={onClose} className="w-full py-6 bg-slate-900 text-white rounded-[2rem] font-black active:scale-95 transition-all mt-4 text-xl">返回戰局</button>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
