<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭麻將記帳助手</title>
    <!-- React & Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        window.FirebaseSDK = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, onSnapshot, updateDoc, collection, getDoc };
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .shadow-up { box-shadow: 0 -4px 10px -1px rgb(0 0 0 / 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        /**
         * 內嵌 SVG 圖標
         */
        const Icon = ({ name, size = 20, className = "" }) => {
            const SVG_PATHS = {
                'plus': <path d="M12 5v14M5 12h14" />,
                'minus': <path d="M5 12h14" />,
                'trash-2': <g><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></g>,
                'settings': <g><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></g>,
                'trophy': <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z" />,
                'crown': <path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z" />,
                'star': <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />,
                'history': <g><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></g>,
                'cloud': <path d="M17.5 19c3.037 0 5.5-2.463 5.5-5.5 0-2.97-2.354-5.394-5.292-5.492C16.892 4.414 14.07 2 10.5 2 6.544 2 3.328 4.887 2.833 8.68 1.411 9.423.5 10.854.5 12.5.5 14.985 2.515 17 5 17h1.5" />,
                'x': <path d="M18 6L6 18M6 6l12 12" />,
                'database': <g><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></g>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {SVG_PATHS[name] || null}
                </svg>
            );
        };

        const WINDS = ["東", "南", "西", "北"];

        const App = () => {
            const [mode, setMode] = useState("loading"); // loading, offline, online
            const [user, setUser] = useState(null);
            const [roomID, setRoomID] = useState(localStorage.getItem('mahjong_room') || "");
            const [isEntered, setIsEntered] = useState(false);
            const [showSummary, setShowSummary] = useState(false);
            
            const [gameState, setGameState] = useState({
                players: ["玩家1", "玩家2", "玩家3", "玩家4"],
                hostName: "場主",
                startingDealer: 0,
                config: { base: 30, tai: 10, useDongQian: true },
                status: { wind: 0, dealerIndex: 0, lianCount: 0 },
                history: [],
                isSetupMode: true
            });

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'mahjong-family';

            // 1. 初始化系統
            useEffect(() => {
                const init = async () => {
                    let firebaseConfig = null;
                    try {
                        // 檢查預裝設定或手動儲存的設定
                        const storedConfig = localStorage.getItem('firebase_config');
                        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                            firebaseConfig = JSON.parse(__firebase_config);
                        } else if (storedConfig) {
                            firebaseConfig = JSON.parse(storedConfig);
                        }
                    } catch (e) { console.warn("Firebase Config Parse Error"); }

                    if (!firebaseConfig) {
                        setMode("offline");
                        const localData = localStorage.getItem('mahjong_local_data');
                        if (localData) setGameState(JSON.parse(localData));
                        return;
                    }

                    try {
                        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FirebaseSDK;
                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        
                        onAuthStateChanged(auth, (u) => {
                            setUser(u);
                            setMode("online");
                        });
                    } catch (e) {
                        console.error("Firebase Init Error:", e);
                        setMode("offline");
                    }
                };
                init();
            }, []);

            // 2. 雲端同步邏輯
            useEffect(() => {
                if (mode !== "online" || !user || !isEntered || !roomID) return;
                const { getFirestore, doc, onSnapshot } = window.FirebaseSDK;
                const db = getFirestore();
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomID);
                
                const unsubscribe = onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        setGameState(snapshot.data());
                    } else {
                        saveData(gameState);
                    }
                });
                return () => unsubscribe();
            }, [mode, user, isEntered, roomID]);

            const saveData = async (newData) => {
                setGameState(newData);
                if (mode === "online" && user && isEntered) {
                    const { getFirestore, doc, setDoc } = window.FirebaseSDK;
                    const db = getFirestore();
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomID);
                    await setDoc(docRef, newData);
                } else {
                    localStorage.setItem('mahjong_local_data', JSON.stringify(newData));
                }
            };

            const totals = useMemo(() => {
                const scores = [0, 0, 0, 0];
                let hostTotal = 0;
                gameState.history.forEach(round => {
                    round.scores.forEach((s, i) => scores[i] += s);
                    if (round.dongQianAmount) hostTotal += round.dongQianAmount;
                });
                return { scores, hostTotal };
            }, [gameState.history]);

            const handleEnterRoom = () => {
                localStorage.setItem('mahjong_room', roomID);
                setIsEntered(true);
            };

            const addRound = (result) => {
                let roundScores = [0, 0, 0, 0];
                let dongQianAmount = 0;
                const { base, tai, useDongQian } = gameState.config;

                if (result.type === 'win') {
                    const amount = base + (result.tai * tai);
                    roundScores[result.winner] += amount;
                    roundScores[result.loser] -= amount;
                } else if (result.type === 'selfDraw') {
                    const amountPerPerson = base + (result.tai * tai);
                    roundScores[result.winner] += (amountPerPerson * 3);
                    gameState.players.forEach((_, i) => { if (i !== result.winner) roundScores[i] -= amountPerPerson; });
                    if (useDongQian) {
                        roundScores[result.winner] -= base;
                        dongQianAmount = base;
                    }
                }

                const newHistory = [{ 
                    id: Date.now(), wind: gameState.status.wind, dealer: gameState.status.dealerIndex, 
                    lian: gameState.status.lianCount, ...result, scores: roundScores, dongQianAmount 
                }, ...gameState.history];

                let nextStatus = { ...gameState.status };
                if ((result.type !== 'draw' && result.winner === gameState.status.dealerIndex) || result.type === 'draw') {
                    nextStatus.lianCount += 1;
                } else {
                    nextStatus.lianCount = 0;
                    nextStatus.dealerIndex = (gameState.status.dealerIndex + 1) % 4;
                    if (nextStatus.dealerIndex === gameState.startingDealer) {
                        nextStatus.wind = (gameState.status.wind + 1) % 4;
                    }
                }
                saveData({ ...gameState, history: newHistory, status: nextStatus });
            };

            if (mode === "loading") return <div className="h-screen flex flex-col items-center justify-center text-slate-400 gap-4">載入系統中...</div>;

            if (!isEntered) {
                return (
                    <div className="p-8 h-screen flex flex-col items-center justify-center space-y-6 max-w-md mx-auto bg-white">
                        <Icon name={mode === "online" ? "cloud" : "database"} size={80} className={mode === "online" ? "text-blue-500" : "text-orange-500"} />
                        <div className="text-center space-y-2">
                            <h1 className="text-2xl font-bold">{mode === "online" ? "進入雲端房間" : "本地模式"}</h1>
                            <p className="text-sm text-slate-500">
                                {mode === "online" ? "輸入房名，全家人手機即時同步" : "目前為單機模式，資料存在此手機"}
                            </p>
                        </div>
                        <input className="w-full p-4 border rounded-2xl text-center text-xl font-bold outline-none" placeholder="房間名稱" value={roomID} onChange={e => setRoomID(e.target.value)} />
                        <button onClick={handleEnterRoom} className="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold">進入記帳</button>
                        {mode === "offline" && (
                            <p className="text-[10px] text-slate-300 text-center">GitHub 版預設為單機紀錄。如需跨裝置同步，請在「設定」中配置 Firebase。</p>
                        )}
                    </div>
                );
            }

            if (gameState.isSetupMode) {
                return (
                    <div className="p-4 space-y-6 max-w-md mx-auto pb-20">
                        <div className="flex justify-between items-center">
                            <h1 className="text-2xl font-bold text-red-700">🀄️ 設定規則</h1>
                            <span className={`text-[10px] px-2 py-1 rounded-full text-white font-bold ${mode==='online'?'bg-blue-500':'bg-orange-500'}`}>
                                {mode==='online' ? '雲端' : '單機'}房: {roomID}
                            </span>
                        </div>
                        <div className="bg-white rounded-2xl border p-4 shadow-sm space-y-4">
                            <h2 className="font-semibold text-sm">玩家與起莊</h2>
                            {gameState.players.map((name, i) => (
                                <div key={i} className="flex items-center gap-2">
                                    <input className="flex-1 border-b py-1 text-sm outline-none" value={name} onChange={e=>{const n=[...gameState.players]; n[i]=e.target.value; saveData({...gameState, players:n});}} />
                                    <button onClick={()=>saveData({...gameState, startingDealer:i})} className={`px-2 py-1 rounded-lg border text-[10px] ${gameState.startingDealer===i?'bg-yellow-100 border-yellow-500 font-bold text-yellow-700':'bg-gray-50'}`}>{gameState.startingDealer===i?'起莊人':'設起莊'}</button>
                                </div>
                            ))}
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-white p-3 rounded-2xl border"><label className="text-[10px] text-gray-400">底</label><input type="number" className="w-full font-bold outline-none" value={gameState.config.base} onChange={e=>saveData({...gameState, config:{...gameState.config, base:parseInt(e.target.value)||0}})} /></div>
                            <div className="bg-white p-3 rounded-2xl border"><label className="text-[10px] text-gray-400">台</label><input type="number" className="w-full font-bold outline-none" value={gameState.config.tai} onChange={e=>saveData({...gameState, config:{...gameState.config, tai:parseInt(e.target.value)||0}})} /></div>
                        </div>
                        <div className="bg-orange-50 rounded-2xl border border-orange-100 p-4 space-y-2">
                            <label className="text-xs font-bold text-orange-800">場主 (收東錢一底)</label>
                            <input className="w-full bg-white rounded-lg px-3 py-2 text-sm outline-none" value={gameState.hostName} onChange={e=>saveData({...gameState, hostName: e.target.value})} />
                        </div>
                        <button onClick={() => saveData({...gameState, isSetupMode: false, status: {wind:0, dealerIndex: gameState.startingDealer, lianCount: 0}})} className="w-full bg-red-600 text-white font-bold py-4 rounded-2xl shadow-lg">確認開始</button>
                    </div>
                );
            }

            return (
                <div className="pb-32 bg-slate-50 min-h-screen">
                    {/* Header */}
                    <div className="bg-red-700 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-start">
                        <div className="flex-1">
                            <div className="text-[10px] opacity-70 mb-1 font-bold">即時總分</div>
                            <div className="grid grid-cols-2 gap-x-2 gap-y-0.5">
                                {gameState.players.map((name, i) => (
                                    <div key={i} className="flex justify-between items-center text-[11px] border-b border-white/10 pb-0.5">
                                        <span className="truncate pr-1 opacity-90">{name}</span>
                                        <span className={`font-mono font-bold ${totals.scores[i] >= 0 ? 'text-yellow-300' : 'text-blue-200'}`}>
                                            {totals.scores[i] > 0 ? `+${totals.scores[i]}` : totals.scores[i]}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="text-right pl-4 shrink-0">
                            <div className="text-[11px] opacity-80 font-bold tracking-widest">{WINDS[gameState.status.wind]}風局</div>
                            <div className="text-5xl font-black leading-none my-1 tracking-tighter">
                                {gameState.players[gameState.status.dealerIndex]}
                            </div>
                            <div className="mt-1 flex items-center justify-end gap-1">
                                <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold">
                                    莊家 {gameState.status.lianCount > 0 ? `連 ${gameState.status.lianCount}` : '平'}
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <div className="p-4 space-y-6 max-w-md mx-auto">
                        <ActionPanel addRound={addRound} players={gameState.players} />

                        {/* 流水帳 */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-center px-1">
                                <span className="font-bold text-sm text-slate-600 flex items-center gap-1"><Icon name="history" size={14}/>戰局流水帳</span>
                                <button onClick={undoLastRound} className="text-xs text-blue-600 font-bold px-2 py-1 bg-blue-50 rounded-lg">撤銷上一把</button>
                            </div>
                            <div className="space-y-2">
                                {gameState.history.map(h => (
                                    <div key={h.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                        <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold mb-1 border-b border-slate-50 pb-1">
                                            <span>{WINDS[h.wind]}風 - {gameState.players[h.dealer]} 莊 ({h.lian > 0 ? `連${h.lian}` : '平'})</span>
                                            <span className="bg-slate-100 px-1 rounded text-slate-500">{h.tai} 台</span>
                                        </div>
                                        <div className="text-[15px] font-bold text-slate-800">
                                            {h.type === 'draw' ? <span className="text-slate-300 italic">流局 (無人胡牌)</span> : (
                                                <div className="flex items-center gap-1">
                                                    <span className="text-red-600">{gameState.players[h.winner]}</span> 
                                                    <span className="text-slate-400 font-normal">{h.type === 'win' ? '胡' : '自摸'}</span>
                                                    {h.type === 'win' && <span className="text-blue-600">{gameState.players[h.loser]}</span>}
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex gap-1.5 mt-2 overflow-x-auto no-scrollbar">
                                            {h.scores.map((s, idx) => s!==0 && (
                                                <span key={idx} className={`px-1.5 py-0.5 rounded text-[9px] font-mono whitespace-nowrap ${s>0?'bg-red-50 text-red-600':'bg-blue-50 text-blue-600'}`}>
                                                    {gameState.players[idx].substring(0,2)}:{s>0?`+${s}`:s}
                                                </span>
                                            ))}
                                            {h.dongQianAmount > 0 && <span className="bg-orange-50 text-orange-700 px-1.5 py-0.5 rounded text-[9px] font-bold">東:{h.dongQianAmount}</span>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Footer Nav */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-around shadow-up z-20">
                        <button onClick={()=>setShowSummary(true)} className="flex flex-col items-center gap-1 text-slate-500 active:text-red-600"><Icon name="trophy"/><span className="text-[10px] font-bold">總結算</span></button>
                        <button onClick={()=>saveData({...gameState, isSetupMode:true})} className="flex flex-col items-center gap-1 text-slate-500 active:text-blue-600"><Icon name="settings"/><span className="text-[10px] font-bold">設定</span></button>
                        <button onClick={()=>{if(confirm("確定清除所有紀錄嗎？")) saveData({...gameState, history:[], isSetupMode:true})}} className="flex flex-col items-center gap-1 text-red-400"><Icon name="trash-2"/><span className="text-[10px] font-bold">清除</span></button>
                    </div>

                    {showSummary && <SummaryModal players={gameState.players} totals={totals} hostName={gameState.hostName} onClose={()=>setShowSummary(false)} />}
                </div>
            );
        };

        const ActionPanel = ({ addRound, players }) => {
            const [entry, setEntry] = useState({ type: 'win', winner: 0, loser: 1, tai: 0 });
            return (
                <div className="bg-white rounded-2xl p-4 shadow-md border border-slate-100 space-y-4">
                    <div className="flex bg-slate-100 p-1 rounded-xl">
                        {['win', 'selfDraw', 'draw'].map(t => (
                            <button key={t} onClick={()=>setEntry({...entry, type:t})} className={`flex-1 py-2 rounded-lg text-sm font-bold transition-all ${entry.type===t?'bg-white shadow text-red-600':'text-slate-500'}`}>
                                {t==='win'?'胡牌':t==='selfDraw'?'自摸':'流局'}
                            </button>
                        ))}
                    </div>
                    {entry.type !== 'draw' && (
                        <div className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-[10px] text-gray-400 font-bold uppercase ml-1">誰贏</label>
                                <div className="grid grid-cols-4 gap-1">
                                    {players.map((n, i) => <button key={i} onClick={()=>setEntry({...entry, winner:i})} className={`py-2 border rounded-lg text-[10px] truncate px-1 transition-all ${entry.winner===i?'bg-red-50 border-red-500 text-red-700 font-bold ring-2 ring-red-500':'bg-white'}`}>{n}</button>)}
                                </div>
                            </div>
                            {entry.type === 'win' && (
                                <div className="space-y-1">
                                    <label className="text-[10px] text-gray-400 font-bold uppercase ml-1">誰放槍</label>
                                    <div className="grid grid-cols-4 gap-1">
                                        {players.map((n, i) => <button key={i} disabled={entry.winner===i} onClick={()=>setEntry({...entry, loser:i})} className={`py-2 border rounded-lg text-[10px] truncate px-1 transition-all ${entry.loser===i?'bg-blue-50 border-blue-500 text-blue-700 font-bold ring-2 ring-blue-500':'bg-white disabled:opacity-20'}`}>{n}</button>)}
                                    </div>
                                </div>
                            )}
                            <div className="flex justify-between items-center px-2 pt-2 border-t border-slate-50">
                                <span className="text-sm font-bold">台數</span>
                                <div className="flex items-center gap-4">
                                    <button onClick={()=>setEntry({...entry, tai:Math.max(0,entry.tai-1)})} className="p-2 bg-slate-100 rounded-full active:bg-slate-200"><Icon name="minus" size={16}/></button>
                                    <span className="text-2xl font-black font-mono w-8 text-center">{entry.tai}</span>
                                    <button onClick={()=>setEntry({...entry, tai:entry.tai+1})} className="p-2 bg-slate-100 rounded-full active:bg-slate-200"><Icon name="plus" size={16}/></button>
                                </div>
                            </div>
                        </div>
                    )}
                    <button onClick={()=>{if(entry.type==='win'&&entry.winner===entry.loser)return; addRound(entry); setEntry({...entry, tai:0});}} className="w-full bg-slate-800 text-white py-4 rounded-xl font-bold shadow-lg">紀錄此把</button>
                </div>
            );
        };

        const SummaryModal = ({ players, totals, hostName, onClose }) => (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden animate-in zoom-in-95 shadow-2xl">
                    <div className="bg-red-600 p-6 text-white text-center relative">
                        <button onClick={onClose} className="absolute top-4 right-4 bg-white/20 p-1 rounded-full"><Icon name="x" size={20}/></button>
                        <Icon name="trophy" size={48} className="mx-auto text-yellow-300 mb-1" />
                        <h2 className="text-2xl font-bold italic">戰果結算</h2>
                    </div>
                    <div className="p-6 space-y-4">
                        <div className="space-y-3">
                            {players.map((n, i) => (
                                <div key={i} className="flex justify-between items-center border-b border-slate-50 pb-2">
                                    <div className="flex items-center gap-2">
                                        <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] text-white font-bold ${totals.scores[i] >= 0 ? 'bg-red-500' : 'bg-blue-500'}`}>{i+1}</div>
                                        <span className="font-bold text-slate-700">{n}</span>
                                    </div>
                                    <span className={`text-xl font-black font-mono ${totals.scores[i]>=0?'text-red-600':'text-blue-600'}`}>{totals.scores[i]>0?`+${totals.scores[i]}`:totals.scores[i]}</span>
                                </div>
                            ))}
                        </div>
                        <div className="bg-orange-50 p-4 rounded-xl flex justify-between items-center border border-orange-100">
                            <div>
                                <div className="font-bold text-orange-800">{hostName}</div>
                                <div className="text-[10px] text-orange-400 font-bold">場主東錢收益</div>
                            </div>
                            <span className="text-xl font-black text-orange-600 font-mono">+{totals.hostTotal}</span>
                        </div>
                        <button onClick={onClose} className="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-lg mt-2">回到遊戲</button>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
